<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Статус архива</title>
    <style>
        body { font-family: cursive; margin: 40px; }
        a { display: inline-block; padding: 10px 20px; background: #538f46; color: white; text-decoration: none; margin: 5px; border-radius: 4px; }
        a:hover { background: #d02f66; }
        table { border-collapse: collapse; width: 100%; margin: 20px 0; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #b8dd8d; color: white; }
        .stats { background: #d1e9b4; padding: 20px; border-radius: 5px; margin: 20px 0; }
    </style>
</head>
<body>
<h1>Состояние архива</h1>
<a href="/">Главная</a>
<a href="/status">Обновить статус</a>
<div class="stats">
    <h2>Внутренняя статистика</h2>
    <p><strong>Всего документов:</strong> {{total_documents}}</p>
    <p><strong>Последнее обновление:</strong> {{last_update}}</p>
</div>
<h2>Полный список документов</h2>
{{documents_list}}
</body>
</html>
